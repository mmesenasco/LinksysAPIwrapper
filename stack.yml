version: "3.8"

services:
  jnap-velop:
    image: jnap-velop:latest          # build & push to your registry, or build on the node
    networks: [homelab]
    ports:
      - "8091:8080"                    # GUI + /api/state
    environment:
      ROUTER_URL: "http://192.168.1.1"
      POLL_INTERVAL: "30"
      # --- Home Assistant via MQTT discovery (leave MQTT_HOST unset to disable) ---
      MQTT_HOST: "mosquitto"           # your broker service/host
      MQTT_PORT: "1883"
      # MQTT_USERNAME: "velop"
      # MQTT_PASSWORD: "..."           # prefer a secret for this too
    secrets:
      - router_password
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: [node.role == manager]

secrets:
  router_password:
    external: true                     # docker secret create router_password ./pw.txt

networks:
  homelab:
    external: true                     # your existing overlay network
